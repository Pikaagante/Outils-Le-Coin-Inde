{% extends "base.html" %}

{% block title %}
Indiecord - Le Coin Indé
{% endblock %}

{% block css %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/indiecord.css') }}">

{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Gestion Indiecord</h1>

    <p>
        Gérer les personnages et les pages du bot Indiecord.
    </p>

</div>


<div class="indiecord-container">


    <div class="indiecord-header">

        <div>

            <label for="feuille-select">
                Page
            </label>

            <select id="feuille-select">
            </select>

        </div>


        <button id="nouvelle-feuille">
            + Nouvelle page
        </button>

    </div>


    <div class="indiecord-table-container">

        <table id="indiecord-table">

            <thead>

                <tr>

                    <th>
                        EN
                    </th>

                    <th>
                        FR
                    </th>

                    <th>
                        Rareté
                    </th>

                    <th>
                    </th>

                </tr>

            </thead>


            <tbody id="indiecord-body">
            </tbody>

        </table>

    </div>


    <div class="indiecord-actions">

        <button id="ajouter-ligne">
            + Ajouter un personnage
        </button>

        <button id="sauvegarder">
            Sauvegarder
        </button>

    </div>


    <p id="indiecord-message"></p>

</div>


<script src="{{ url_for('static', filename='js/indiecord.js') }}"></script>

{% endblock %}
